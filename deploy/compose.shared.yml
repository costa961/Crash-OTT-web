# The game's server alone, for a server whose ports 80 and 443 another reverse proxy already has (another Caddy:
# caddy-site.example is the site to add to it, login included). The game listens on 127.0.0.1 only.
#   in .env: CRASHOTT_GAME, CRASHOTT_HTTP_PORT (default 8082), CRASHOTT_IMAGE
#   docker compose -f compose.shared.yml up -d
# PRIVATE: the proxy in front of it must ask for a login (caddy-site.example does).
name: crashott-web
services:
  game:
    image: ${CRASHOTT_IMAGE:-crashott-web:latest}
    restart: unless-stopped
    ports: ["127.0.0.1:${CRASHOTT_HTTP_PORT:-8082}:8080"]
    volumes:
      - ${CRASHOTT_GAME:-./game}:/game:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: local }
