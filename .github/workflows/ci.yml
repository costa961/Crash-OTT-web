# Checks what can be checked without the game (the repository holds none of it):
# - the page type-checks and builds;
# - this project's patches still apply to the pinned XenonRecomp and crashott-pc;
# - the Xenos -> WGSL translator's output validates with naga, on the synthetic shaders the
#   harness assembles itself (every opcode, fetch and control-flow form; tools/shader_test.cpp);
# - the Python tools compile.
name: CI

on:
  push:
  pull_request:

jobs:
  page:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Type-check and build the page
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          node node_modules/typescript/bin/tsc -p .
          node build.mjs

  patches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: crashott-pc-web.patch applies to the pinned crashott-pc
        run: |
          work=$(mktemp -d)
          cp -r third_party/crashott-pc/runtime "$work/"
          (cd "$work" && git init -q && git apply --check --ignore-whitespace "$GITHUB_WORKSPACE/patches/crashott-pc-web.patch")
      - name: XenonRecomp patches apply to the pinned XenonRecomp
        run: |
          commit=$(sed -n 's/^XENON_COMMIT = "\(.*\)"/\1/p' third_party/crashott-pc/tools/setup.py | tr -d '\r')
          git clone -q https://github.com/hedge-dev/XenonRecomp.git xenon
          cd xenon
          git checkout -q "$commit"
          git apply --whitespace=nowarn "$GITHUB_WORKSPACE/third_party/crashott-pc/patches/XenonRecomp.patch"
          git apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/patches/XenonRecomp-wasm.patch"

  shaders:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache naga
        id: naga
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-27.0.0
      - name: Install naga
        if: steps.naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version 27.0.0 --locked
      - name: Translate and validate the synthetic shaders
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang >/dev/null
          mkdir -p out/userdata/ucode
          NAGA=~/.cargo/bin/naga bash tools/shader_test.sh | tee shader_test.log
          grep -q ' 0 failed' shader_test.log

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile the Python tools
        run: python3 -m py_compile tools/xiso.py
