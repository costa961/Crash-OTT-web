<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crash of the Titans (web)</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b0d; --fg: #e8e6e3; --muted: #8a8a93; --accent: #f28c28; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  #start h1 { margin: 0; font-size: 28px; }
  #start p { margin: 0; color: var(--muted); max-width: 520px; }
  button { font: inherit; padding: 10px 28px; border-radius: 8px; border: 0; background: var(--accent); color: #111; font-weight: 600; cursor: pointer; }
  #data { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 8px; width: min(420px, 100%); }
  #data progress { width: 100%; height: 8px; accent-color: var(--accent); }
  #dataText { color: var(--muted); font-size: 14px; margin: 0; }
  button.secondary { background: transparent; color: var(--fg); border: 1px solid #3a3a42; font-weight: 500; padding: 8px 20px; }
  .keys { font-size: 13px; }
  #langRow { color: var(--muted); font-size: 14px; display: flex; gap: 8px; align-items: center; }
  select { font: inherit; background: #1a1a1f; color: var(--fg); border: 1px solid #3a3a42; border-radius: 6px; padding: 4px 8px; }
  #logBtn { position: fixed; top: 10px; right: 12px; z-index: 5; padding: 4px 12px; font-size: 13px; opacity: 0.55; }
  #logBtn:hover { opacity: 1; }
  #status { position: fixed; left: 12px; bottom: 10px; color: var(--muted); font-size: 13px; white-space: pre-wrap; max-width: calc(100% - 24px); }
</style>
</head>
<body>
<div id="stage" hidden><canvas id="canvas" width="1280" height="720"></canvas></div>
<div id="start">
  <h1>Crash of the Titans</h1>
  <p>The Xbox 360 game, recompiled to WebAssembly from your own copy. Unofficial, work in progress.</p>
  <button id="play">Start</button>
  <label id="langRow">Language <select id="language"></select></label>
  <div id="data">
    <p id="dataText">Game data: checking...</p>
    <progress id="dataBar" max="1" value="0" hidden></progress>
    <button id="download" class="secondary" hidden>Download game data</button>
  </div>
  <p class="keys">Gamepad, or keyboard: WASD move · Space jump · J attack · K / I · Q / E triggers · Esc start · arrows menus</p>
</div>
<div id="status"></div>
<button id="logBtn" class="secondary" title="Save the log to a file (to report a problem)">Log</button>
<script type="module" src="main.js"></script>
</body>
</html>
